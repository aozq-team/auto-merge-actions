name: Enable repository auto-merge

on:
  workflow_dispatch:
    inputs:
      credential:
        description: Organization Actions secret to use
        type: choice
        required: true
        default: GH_CLASSIC
        options:
          - GH_CLASSIC
          - COPILOT_GITHUB_TOKEN
      repositories:
        description: Space-separated owner/repository names
        type: string
        required: true
        default: aozq/expo-native-core aozq/Voice-Flow-Engine

permissions: {}

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    env:
      CREDENTIAL: ${{ inputs.credential }}
      REPOSITORIES: ${{ inputs.repositories }}
      GH_TOKEN: ${{ inputs.credential == 'GH_CLASSIC' && secrets.GH_CLASSIC || inputs.credential == 'COPILOT_GITHUB_TOKEN' && secrets.COPILOT_GITHUB_TOKEN || '' }}
    steps:
      - name: Validate inputs and enable repository auto-merge
        shell: bash
        run: |
          set -euo pipefail

          fail_validation() {
            printf '::error::%s\n' "$1"
            printf '## Configuration error\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          case "$CREDENTIAL" in
            GH_CLASSIC|COPILOT_GITHUB_TOKEN) ;;
            *) fail_validation 'Credential must be GH_CLASSIC or COPILOT_GITHUB_TOKEN.' ;;
          esac

          if [[ -z "$REPOSITORIES" || "$REPOSITORIES" == *[!A-Za-z0-9_./\ -]* ]]; then
            fail_validation 'Repositories must be space-separated owner/repository names (no tabs, newlines, or shell syntax).'
          fi
          read -r -a targets <<< "$REPOSITORIES"
          if (( ${#targets[@]} == 0 )); then
            fail_validation 'At least one repository is required.'
          fi
          for repo in "${targets[@]}"; do
            if [[ ! "$repo" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ || "${repo#*/}" == "." || "${repo#*/}" == ".." ]]; then
              fail_validation 'Each repository must use the owner/repository format.'
            fi
          done

          if [[ -z "$GH_TOKEN" ]]; then
            fail_validation "The selected organization secret ($CREDENTIAL) is unavailable. For this public repository, set its organization Actions secret visibility to All repositories, or Selected repositories including aozq-team/auto-merge-actions. Private repositories visibility does not include public repositories."
          fi

          printf '## Repository auto-merge settings\n\nCredential: `%s`\n\nNo pull requests are merged or queued by this workflow.\n' "$CREDENTIAL" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          log_dir="$(mktemp -d)"
          trap 'rm -f "$log_dir/edit.log" "$log_dir/verify.out" "$log_dir/verify.err" "$log_dir/diagnostics.log" "$log_dir/account.log"; rmdir "$log_dir"' EXIT

          {
            printf 'Account diagnostic time (UTC): '
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            printf 'GET https://api.github.com/user (authenticated credential owner, not the runner organization):\n'
            diagnostic_status=0
            gh api user --jq '{login, type, plan: {name: .plan.name}}' || diagnostic_status=$?
            printf 'Account diagnostic exit code: %s\n' "$diagnostic_status"
            printf 'This is the reported GitHub account plan, not Copilot Pro billing. It does not independently verify an active subscription.\n'
          } > "$log_dir/account.log" 2>&1
          cat "$log_dir/account.log"
          {
            printf '\n### Credential account identity and reported plan\n\n````text\n'
            cat "$log_dir/account.log"
            printf '\n````\n'
          } >> "$GITHUB_STEP_SUMMARY"

          for repo in "${targets[@]}"; do
            printf '\n=== %s ===\n' "$repo"
            edit_status=0
            gh repo edit "$repo" --enable-auto-merge > "$log_dir/edit.log" 2>&1 || edit_status=$?
            cat "$log_dir/edit.log"

            verify_status=0
            gh api "repos/$repo" --jq .allow_auto_merge > "$log_dir/verify.out" 2> "$log_dir/verify.err" || verify_status=$?
            cat "$log_dir/verify.out"
            cat "$log_dir/verify.err"
            verified="$(cat "$log_dir/verify.out")"

            result=PASS
            : > "$log_dir/diagnostics.log"
            if (( edit_status != 0 || verify_status != 0 )) || [[ "$verified" != "true" ]]; then
              result=FAIL
              failed=1
              printf '::error::%s: edit exit=%s, verification exit=%s; allow_auto_merge must be true.\n' "$repo" "$edit_status" "$verify_status"
              {
                printf 'GET https://api.github.com/repos/%s (repository owner and credential permissions):\n' "$repo"
                diagnostic_status=0
                gh api "repos/$repo" --jq '{allow_auto_merge, private, archived, permissions, owner: {login: .owner.login, type: .owner.type}}' || diagnostic_status=$?
                printf 'Repository diagnostic exit code: %s\n\n' "$diagnostic_status"
                printf 'GraphQL repository settings:\n'
                diagnostic_status=0
                gh api graphql \
                  -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { autoMergeAllowed viewerCanAdminister } }' \
                  -f owner="${repo%%/*}" -f name="${repo#*/}" || diagnostic_status=$?
                printf '\nGraphQL diagnostic exit code: %s\n' "$diagnostic_status"
              } > "$log_dir/diagnostics.log" 2>&1
              cat "$log_dir/diagnostics.log"
            fi

            {
              printf '\n### %s: %s\n\n' "$repo" "$result"
              printf 'Edit exit code: `%s`; verification exit code: `%s`.\n\n' "$edit_status" "$verify_status"
              printf 'Edit output (including exact GitHub errors):\n\n````text\n'
              cat "$log_dir/edit.log"
              printf '\n````\n\nVerification output:\n\n````text\n'
              cat "$log_dir/verify.out"
              cat "$log_dir/verify.err"
              printf '\n````\n'
              if [[ "$result" == FAIL ]]; then
                printf '\nRead-only diagnostics (errors preserved):\n\n````text\n'
                cat "$log_dir/diagnostics.log"
                printf '\n````\n'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
